# Regenerate with: dart run flutter_launcher_icons
#
# Source art is generated by tool/branding/generate_brand_assets_test.dart:
#   flutter test tool/branding/generate_brand_assets_test.dart --update-goldens
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png
